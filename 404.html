<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <!-- Google tag (gtag.js) -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Abdalla Maher</title>
  <meta name="description" content="The page you are looking for does not exist or has been moved.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-black: #0A0A0A;
      --c-white: #FAFAF8;
      --c-accent: #D53829;
  --c-accent-on-dark: #E0422E;
      --c-text-dim: rgba(250,250,248,0.55);
      --f-body: 'IBM Plex Sans', 'IBM Plex Sans Arabic', 'Noto Sans TC', sans-serif;
      --f-heading: 'IBM Plex Sans', 'IBM Plex Sans Arabic', 'Noto Sans TC', sans-serif;
      --f-mono: 'IBM Plex Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--f-body);
      background: var(--c-black);
      color: var(--c-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    html[dir="rtl"] {
      --f-body: 'IBM Plex Sans Arabic', 'IBM Plex Sans', 'Noto Sans TC', sans-serif;
      --f-heading: 'Amiri', 'IBM Plex Sans Arabic', serif;
    }
    html[lang="zh-TW"] {
      --f-body: 'Noto Sans TC', 'IBM Plex Sans', sans-serif;
      --f-heading: 'Noto Sans TC', 'IBM Plex Sans', sans-serif;
    }
    .error-code {
      font-family: var(--f-mono);
      font-size: clamp(80px, 15vw, 160px);
      font-weight: 500;
      color: var(--c-accent);
      line-height: 1;
      margin-bottom: 16px;
    }
    .error-title {
      font-family: var(--f-heading);
      font-size: clamp(24px, 4vw, 40px);
      font-weight: 700;
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 16px;
      color: var(--c-text-dim);
      max-width: 400px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--f-body);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: var(--c-accent);
      color: var(--c-white);
      border-radius: 2px;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .btn-home:hover { background: #b92d20; }
    :focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
    .lang-switcher {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 4px;
      z-index: 10;
    }
    html[dir="rtl"] .lang-switcher { right: auto; left: 20px; }
    .lang-btn {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--f-mono);
      letter-spacing: 0.04em;
      border-radius: 2px;
      border: none;
      background: none;
      color: var(--c-text-dim);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn:hover { color: var(--c-white); }
    .lang-btn.active { background: var(--c-accent); color: var(--c-white); }
  </style>
</head>
<body>
  <div class="lang-switcher" role="group" aria-label="Language switcher">
    <button type="button" class="lang-btn active" data-lang="en">EN</button>
    <button type="button" class="lang-btn" data-lang="ar">ع</button>
    <button type="button" class="lang-btn" data-lang="zh-TW">繁</button>
  </div>
  <div class="error-code">404</div>
  <h1 class="error-title" data-i18n="page_404_title">Page Not Found</h1>
  <p class="error-desc" data-i18n="page_404_desc">The page you are looking for does not exist or has been moved.</p>
  <a href="/" class="btn-home" data-i18n="page_404_back">Back to Home</a>

  <script src="js/i18n.js"></script>
  <script>
    (function(){
      var html = document.documentElement;
      var btns = document.querySelectorAll('.lang-btn');
      var els = document.querySelectorAll('[data-i18n]');
      var stored = localStorage.getItem('lang');

      function apply(l){
        if(!I18N[l]) return;
        var s = I18N[l];
        els.forEach(function(el){
          var k = el.getAttribute('data-i18n');
          if(s[k]!==undefined) el.textContent = s[k];
        });
        if(l==='ar'){ html.setAttribute('dir','rtl'); html.setAttribute('lang','ar'); }
        else { html.setAttribute('dir','ltr'); html.setAttribute('lang',l); }
        btns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-lang')===l); });
        localStorage.setItem('lang',l);
      }
      if(stored && I18N[stored]) apply(stored);
      btns.forEach(function(b){
        b.addEventListener('click',function(){ apply(this.getAttribute('data-lang')); });
      });
    })();
  </script>
</body>
</html>
