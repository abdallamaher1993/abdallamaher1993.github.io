# ينشر موقع البورتفوليو على GitHub Pages تلقائيًا
name: Deploy Portfolio

on:
  push:
    branches: [main, portfolio]
    paths: ['index.html', 'css/**', 'js/**', 'img/**', 'content.json', 'admin/**', '404.html', 'favicon.svg', '.github/workflows/deploy-portfolio.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  activate-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Activate GitHub Pages (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pages --method POST \
            -f source.branch=portfolio -f source.path=/ 2>/dev/null || true

  deploy:
    needs: activate-pages
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
