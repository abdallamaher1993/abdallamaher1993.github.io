# Refreshes the "latest videos" strip from the public channel feed (no API key needed)
name: Update Latest Videos

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Regenerate js/latest-videos.js
        run: python3 scripts/update-latest-videos.py
      - name: Commit and trigger deploy if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- js/latest-videos.js; then
            echo "No change."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/latest-videos.js
          git commit -m "Update latest videos from channel feed"
          git push origin HEAD:main
          gh workflow run deploy-portfolio.yml --ref main
